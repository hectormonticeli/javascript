<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primeiros passos com DOM</title>
    <style>
        body {
            background-color: rgb(68, 125, 199);
            color: white;
            font: normal 18pt Arial;
        }
    </style>
</head>
<body>
    <h1>Iniciando estudos com DOM</h1>
    <p>Aqui vai o resultado</p>
    <p>Aprendendo a usar o <strong>DOM</strong> em JavaScript</p>
    <div id="msg">Clique em mim</div><br>

    <script>
        var p1 = window.document.getElementsByTagName('p')[0]
        var p2 = window.document.getElementsByTagName('p')[1]
        var corpo = window.document.body
        window.document.write('Está escrito: ' + p1.innerText)
        p2.style.color = 'blue'
        // corpo.style.background = 'black'

        window.document.write('<br><br>' + p2.innerText)
        window.document.write('<br>' + p2.innerHTML)

        var d = window.document.getElementById('msg')
        d.style.background = 'green'
        d.innerText = 'Estou aguardando...'

        window.document.querySelector('div#msg')
        d.style.color = "yellow"

    </script>
</body>
</html>
