<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <script>
        var salario = Number(window.prompt('Qual seu salário?'))

        document.write('Seu salário em Real: ' + salario.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'}) + '<br>')

        document.write('Your rent to Dolar: ' + (salario / 6.3).toLocaleString('en', {style: 'currency', currency: 'USD'}))
    </script>
</body>
</html>
